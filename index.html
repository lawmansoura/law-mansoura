<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>طلاب الفرقة الثالثة – كلية الحقوق جامعة المنصورة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1a2e;--bg2:#12294a;--card:rgba(255,255,255,.07);--tx:#f4f1ea;--mu:#aab6c8;--gold:#d4a24c;--gold2:#f0cf8a;--gr:#1f8a4c;--bd:rgba(212,162,76,.25);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#0b1a2e}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:Cairo,Tahoma,Arial,sans-serif;color:var(--tx);background:linear-gradient(135deg,var(--bg),var(--bg2),#0e3b2e,var(--bg));background-size:300% 300%;animation:bg 18s ease infinite;overflow-x:hidden}
@keyframes bg{50%{background-position:100% 50%}}
.orb{position:fixed;border-radius:50%;filter:blur(60px);opacity:.25;z-index:0;animation:fl 14s ease-in-out infinite}
.o1{width:300px;height:300px;background:var(--gold);top:-80px;right:-60px}.o2{width:260px;height:260px;background:var(--gr);bottom:-60px;left:-50px;animation-delay:-6s}
@keyframes fl{50%{transform:translate(30px,40px) scale(1.15)}}
.wrap{position:relative;z-index:1;max-width:720px;margin:auto;padding:16px}
.glass{background:var(--card);border:1px solid var(--bd);border-radius:20px;backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.logo{width:150px;height:150px;border-radius:50%;display:block;margin:0 auto;animation:pop 1s cubic-bezier(.2,1.4,.4,1) both,glow 4s ease-in-out infinite;background:#fff}
@keyframes pop{from{transform:scale(.2) rotate(-90deg);opacity:0}}
@keyframes glow{50%{box-shadow:0 0 45px rgba(212,162,76,.7);transform:translateY(-6px)}}
.login{max-width:380px;margin:6vh auto 0;padding:28px 24px;text-align:center;animation:up .8s .2s both}
@keyframes up{from{transform:translateY(30px);opacity:0}}
h1{font-size:1.3rem;margin:14px 0 4px;background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mu);font-size:.9rem;margin:0 0 18px}
input,textarea,select{width:100%;padding:12px 14px;margin:6px 0;border-radius:12px;border:1px solid var(--bd);background:rgba(0,0,0,.3);color:var(--tx);font:inherit;outline:none;transition:.2s}
input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,162,76,.2)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 18px;font-weight:600;color:#1a1204;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:.2s}
button:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(212,162,76,.4)}
.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.full{width:100%;margin-top:8px}.err{color:#ff8f8f;font-size:.85rem;min-height:1.2em}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:16px;animation:up .6s both}
header img{width:52px;height:52px;border-radius:50%;background:#fff}header b{flex:1;font-size:.95rem;line-height:1.3}
header small{display:block;color:var(--mu);font-weight:400}
.comp{padding:16px;margin-bottom:16px;animation:up .6s both}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
.post{padding:16px;margin-bottom:16px;animation:up .6s both;transition:.3s}.post:hover{transform:translateY(-3px);border-color:var(--gold)}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--gr),var(--gold));color:#fff;flex:none}
.ph small{color:var(--mu);display:block;font-size:.75rem}.tag{font-size:.7rem;padding:2px 8px;border-radius:99px;background:var(--gold);color:#1a1204;margin-inline-start:6px}
.pt{white-space:pre-wrap;line-height:1.8;margin:6px 0}.pimg{width:100%;border-radius:14px;margin-top:8px;max-height:420px;object-fit:cover}
.file{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:rgba(0,0,0,.25);margin-top:8px;cursor:pointer}
.bar{display:flex;gap:8px;margin-top:12px;border-top:1px solid var(--bd);padding-top:10px}.bar button{flex:1;background:transparent;color:var(--tx);border:1px solid var(--bd)}
.bar .on{background:rgba(212,162,76,.25);color:var(--gold2);animation:beat .4s}@keyframes beat{50%{transform:scale(1.15)}}
.cm{background:rgba(0,0,0,.22);border-radius:12px;padding:8px 12px;margin-top:8px;font-size:.9rem;animation:up .4s both}.cm b{color:var(--gold2)}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}.fol{position:relative;padding:18px 10px;text-align:center;cursor:pointer;background:var(--card);border:1px solid var(--bd);border-radius:18px;transition:.3s;animation:up .6s both}.fol:hover{transform:translateY(-5px) rotate(-1deg);border-color:var(--gold);box-shadow:0 10px 28px rgba(212,162,76,.3)}.fol span{font-size:2.4rem;display:block;animation:fl 5s ease-in-out infinite}.fol b{display:block;margin:6px 0 2px}.fol small{color:var(--mu)}.fol i{position:absolute;top:6px;left:8px;font-style:normal;font-size:.75rem;padding:2px 6px;border-radius:8px;background:rgba(0,0,0,.35)}.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:9;max-width:90%;padding:12px 18px;border-radius:14px;background:#12294a;border:1px solid var(--gold);color:var(--tx);font-size:.9rem;line-height:1.7;animation:up .4s both}.rs{margin-top:10px;font-size:.9rem;color:var(--mu);cursor:pointer;display:inline-block}.rs span{font-size:1.05rem;letter-spacing:-2px}.pick{display:flex;justify-content:space-around;margin-top:8px;padding:8px;border-radius:99px;background:rgba(0,0,0,.4);border:1px solid var(--bd);animation:pop .35s both}.pick span{font-size:1.7rem;cursor:pointer;transition:.2s}.pick span:hover{transform:translateY(-8px) scale(1.4)}.pdf{margin-top:8px;border-radius:14px;overflow:hidden;background:rgba(0,0,0,.25);border:1px solid var(--bd)}.pdf img{width:100%;max-height:360px;object-fit:cover;object-position:top;background:#fff;display:block}.pdf img[src=""]{display:none}.pm{display:flex;gap:10px;align-items:center;padding:10px 12px}.pm span{font-size:1.8rem}.pb{display:flex;gap:8px;padding:0 12px 12px}.pb button{flex:1}.empty{text-align:center;color:var(--mu);padding:40px}.hide{display:none!important}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>
<div class="wrap">

<div id="login" class="glass login">
  <img class="logo" data-l alt="شعار كلية الحقوق">
  <h1>طلاب الفرقة الثالثة</h1>
  <p class="sub">كلية الحقوق – جامعة المنصورة</p>
  <input id="u" placeholder="اسم المستخدم أو إيميل الأدمن" autocomplete="off" autocapitalize="off">
  <input id="p" type="password" placeholder="كلمة المرور" autocomplete="off">
  <div class="err" id="e1"></div>
  <button class="full" id="go">دخول</button>
</div>

<div id="gate" class="glass login hide">
  <img class="logo" data-l alt="">
  <h1>أهلاً بيك 👋</h1>
  <p class="sub">اكتب اسمك الأول والأخير ورقم موبايلك علشان تدخل</p>
  <input id="fn" placeholder="الاسم الأول"><input id="ln" placeholder="الاسم الأخير"><input id="ph" type="tel" inputmode="numeric" maxlength="11" dir="ltr" placeholder="رقم الموبايل (11 رقم)">
  <div class="err" id="e2"></div>
  <button class="full" id="ok">متابعة</button>
</div>

<div id="app" class="hide">
  <header class="glass"><img data-l alt=""><b>طلاب الفرقة الثالثة<small>كلية الحقوق – جامعة المنصورة</small></b><button class="ghost hide" id="memb">👥</button><button class="ghost" id="out">خروج</button></header>
  <div id="mem" class="glass comp hide"></div>
  <div id="comp" class="glass comp hide">
    <div class="row" style="margin-bottom:8px"><input id="fon" placeholder="📁 اسم مادة / مجلد جديد"><button id="addf" style="flex:none">إضافة مجلد</button></div>
    <textarea id="txt" rows="3" placeholder="اكتب خبر أو رسالة للطلاب..."></textarea>
    <div class="row"><select id="kind"><option value="خبر">📰 خبر</option><option value="رسالة">💬 رسالة</option><option value="ملف">📎 ملف</option><option value="صورة">🖼️ صورة</option></select>
    <input id="fl" type="file"></div>
    <div class="err" id="e3"></div>
    <button class="full" id="pub">نشر</button>
  </div>
  <div id="feed"></div>
</div>
</div>

<div id="toast" class="toast hide"></div>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>

function start(){subscribe();$('login').classList.add('hide');$('gate').classList.add('hide');$('app').classList.remove('hide');
  if(role==='admin')$('comp').classList.remove('hide');render()}
$('out').onclick=async()=>{try{await signOut(auth)}catch(e){}location.reload()};

$('pub').onclick=async()=>{
  const t=$('txt').value.trim(),f=$('fl').files[0],e=$('e3');e.textContent='';
  if(!t&&!f){e.textContent='اكتب حاجة أو اختار ملف';return}
  if(!db){e.textContent='النشر مش متاح دلوقتي';return}
  $('pub').disabled=true;$('pub').textContent='جاري النشر...';
  try{
    const o={text:t,kind:$('kind').value,ts:Date.now(),fo:cur||''};
    if(f){if(!assets)throw new Error('رفع الملفات مش متاح');const r=await assets.upload(f,(i,n)=>{$('pub').textContent='جاري الرفع '+i+'/'+n});o.fid=r.id;o.n=r.n;o.sz=r.size;o.fname=f.name;o.ftype=r.type||f.type||''}
    await db.collection('posts').doc('p'+o.ts).set(o);
    $('txt').value='';$('fl').value=''
  }catch(x){e.textContent=x.code==='permission-denied'?'مفيش صلاحية: ادخل بإيميل الأدمن وتأكد إن الرولز اتنشرت':'حصلت مشكلة: '+(x.message||'')}
  $('pub').disabled=false;$('pub').textContent='نشر'
};

$('addf').onclick=async()=>{const v=$('fon').value.trim();if(!v||!db)return;$('fon').value='';const t=Date.now();await db.collection('posts').doc('f'+t).set({isf:1,text:v,ts:t})};
function rm(){const b=$('memb'),m=$('mem');if(role!=='admin'){b.classList.add('hide');m.classList.add('hide');return}
  b.classList.remove('hide');b.textContent='👥 الطلاب ('+M.length+')';if(!showM){m.classList.add('hide');return}m.classList.remove('hide');
  m.innerHTML='<b>الطلاب المسجلين</b>'+(M.length?[...M].sort((a,b)=>b.ts-a.ts).map(x=>`<div class="cm"><b>${esc(x.name)}</b> — <span dir="ltr">${esc(x.phone)}</span></div>`).join(''):'<div class="cm">لسه مفيش حد سجل</div>')+'<button class="full" id="csv">تحميل القائمة (CSV)</button>'}
$('memb').onclick=()=>{showM=!showM;rm()};
$('mem').addEventListener('click',e=>{if(e.target.id==='csv'&&dl){const q=s=>'"'+(/^[=+\-@]/.test(s)?"'":'')+String(s).replace(/"/g,'""')+'"';dl.save({filename:'students.csv',data:'\ufeffالاسم,الرقم\n'+M.map(x=>q(x.name)+','+q(x.phone)).join('\n')})}});
function loadPdfs(){if(!window.pdfjsLib)return;pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
document.querySelectorAll('img[data-pv]').forEach(async im=>{const id=im.dataset.pv;if(im.getAttribute('src'))return;if(PV[id]){im.src=PV[id];return}
 try{const b=await getB({fid:id,n:+im.dataset.n,ftype:'application/pdf'}),pdf=await pdfjsLib.getDocument({data:await b.arrayBuffer()}).promise,pg=await pdf.getPage(1),v0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:700/v0.width}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;PV[id]=c.toDataURL('image/jpeg',.75);im.src=PV[id]}catch(e){}})}
{const _r=render;render=function(){_r();loadImgs();loadPdfs()}}
function render(){
  if(!role||!name)return;
  const el=$('feed');rm();
  const FO=P.filter(p=>p.isf),PO=P.filter(p=>!p.isf&&(p.fo||'')===(cur||'')),cf=cur&&FO.find(f=>f.id===cur);
  let top='';
  if(cur)top=`<div class="glass comp" style="display:flex;align-items:center;gap:10px"><button class="ghost" data-back="1" style="flex:none">→ رجوع</button><b>📁 ${esc(cf?cf.text:'')}</b></div>`;
  else if(FO.length)top='<div class="folders">'+FO.sort((a,b)=>a.ts-b.ts).map(f=>`<div class="fol" data-fo="${f.id}"><span>📁</span><b>${esc(f.text)}</b><small>${P.filter(p=>!p.isf&&p.fo===f.id).length} منشور</small>${role==='admin'?`<i data-delf="${f.id}">${arm===f.id?'تأكيد الحذف؟':'🗑️'}</i>`:''}</div>`).join('')+'</div>';
  const none=PO.length?'':cur?'<div class="empty glass">المجلد فاضي 📭</div>':FO.length?'':'<div class="empty glass">لسه مفيش منشورات 📭</div>';
  el.innerHTML=top+none+[...PO].sort((a,b)=>b.ts-a.ts).map(p=>{
    const lk=L.filter(l=>l.post===p.id),mr=lk.find(l=>l.id===p.id+'_'+uid),mine=!!mr,cs=C.filter(c=>c.post===p.id).sort((a,b)=>a.ts-b.ts);
    const img=p.fid&&(p.ftype||'').startsWith('image/'),pdf=p.fid&&((p.ftype||'')==='application/pdf'||/\.pdf$/i.test(p.fname||''));
    return `<div class="glass post"><div class="ph"><div class="av">إ</div><div><b>الإدارة</b><span class="tag">${esc(p.kind||'')}</span><small>${ago(p.ts)}</small></div>${role==='admin'?`<button class="ghost" style="flex:none;padding:6px 10px" data-del="${p.id}">${arm===p.id?'تأكيد؟':'🗑️'}</button>`:''}</div>
    ${p.text?`<div class="pt">${esc(p.text).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener" style="color:var(--gold2)">$1</a>')}</div>`:''}
    ${img?`<img class="pimg" data-fid="${p.fid}" data-n="${p.n}" data-t="${esc(p.ftype)}" src="${BL[p.fid]||''}" alt="">`:''}
    ${pdf?`<div class="pdf"><img data-pv="${p.fid}" data-n="${p.n}" src="${PV[p.fid]||''}" alt=""><div class="pm"><span>📕</span><div><b>${esc(p.fname)}</b><small style="display:block;color:var(--mu)">PDF${p.sz?' · '+(p.sz/1048576).toFixed(1)+' ميجا':''}</small></div></div><div class="pb"><button data-open="${p.id}">👁️ عرض</button><button class="ghost" data-dl="${p.id}">⬇️ تحميل</button></div></div>`:''}${p.fid&&!img&&!pdf?`<div class="file" data-dl="${p.id}"><span style="font-size:1.6rem">📄</span><div><b>${esc(p.fname)}</b><small style="display:block;color:var(--mu)">اضغط للتحميل</small></div></div>`:''}
    ${lk.length?`<div class="rs" data-who="${p.id}"><span>${[...new Set(lk.map(l=>l.r||'👍'))].slice(0,3).join('')}</span> ${lk.length}</div>`:''}${who[p.id]&&lk.length?`<div class="cm">${lk.map(l=>`<div>${l.r||'👍'} <b>${esc(l.name)}</b></div>`).join('')}</div>`:''}<div class="bar"><button class="${mine?'on':''}" data-lk="${p.id}">${mine?(mr.r||'👍'):'👍'} ${mine?'تفاعلت':'تفاعل'}</button><button data-cm="${p.id}">💬 تعليق ${cs.length||''}</button></div>${pk[p.id]?`<div class="pick">${RX.map(x=>`<span data-rx="${x}" data-p="${p.id}">${x}</span>`).join('')}</div>`:''}
    ${open[p.id]?`<div>${cs.map(c=>`<div class="cm">${role==='admin'?`<i data-delc="${c.id}" style="cursor:pointer;float:left;font-style:normal;font-size:.8rem">${arm===c.id?'تأكيد الحذف؟':'🗑️'}</i>`:''}<b>${esc(c.name)}</b>: ${esc(c.text)}</div>`).join('')}<div class="row" style="margin-top:8px"><input id="ci${p.id}" placeholder="اكتب تعليق..."><button style="flex:none" data-sc="${p.id}">إرسال</button></div></div>`:''}</div>`}).join('');
}
$('feed').addEventListener('click',async e=>{
  const t=e.target.closest('[data-lk],[data-cm],[data-sc],[data-del],[data-dl],[data-back],[data-fo],[data-delf],[data-rx],[data-who],[data-delc],[data-open]');if(!t||!db)return;
  const d=t.dataset;
  if(d.lk){pk[d.lk]=!pk[d.lk];render()}
  else if(d.delc){if(arm===d.delc){arm='';await db.collection('comments').doc(d.delc).delete()}else{arm=d.delc;render()}}
  else if(d.open){const p=P.find(x=>x.id===d.open);if(p){const w=window.open('','_blank');try{const u=URL.createObjectURL(await getB(p));if(w)w.location=u;else save(p)}catch(x){if(w)w.close()}}}
  else if(d.who){who[d.who]=!who[d.who];render()}
  else if(d.rx){const id=d.p,r=db.collection('likes').doc(id+'_'+uid),my=L.find(l=>l.id===id+'_'+uid);pk[id]=false;(my&&(my.r||'👍')===d.rx)?await r.delete():await r.set({post:id,name,r:d.rx,ts:Date.now()});render()}
  else if(d.cm){open[d.cm]=!open[d.cm];render()}
  else if(d.sc){const i=$('ci'+d.sc),v=i.value.trim();if(v){i.value='';await db.collection('comments').doc('c'+Date.now()+uid).set({post:d.sc,name,text:v,ts:Date.now()})}}
  else if(d.back){cur=null;render()}
  else if(d.fo){cur=d.fo;render()}
  else if(d.del||d.delf){const k=d.del||d.delf;if(arm===k){arm='';if(d.delf)for(const x of P.filter(x=>x.fo===k))await rmP(x);await rmP(P.find(x=>x.id===k)||{id:k})}else{arm=k;render()}}
  else if(d.dl){const p=P.find(x=>x.id===d.dl);if(p)save(p)}
});
